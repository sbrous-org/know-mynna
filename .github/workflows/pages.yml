# Publishes site/ to GitHub Pages. Needs Settings > Pages > Source = "GitHub Actions".
name: Deploy landing page
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages lets browsers cache files for ~10 minutes, so a visitor can get new HTML with an old styles.css or app.js.
      # Stamp the asset links with the commit so every deploy uses fresh URLs.
      - name: Version asset URLs
        run: |
          rm -rf _site && cp -r site _site
          sed -i -E "s#(href|src)=\"(styles\.css|demo\.css|app\.js|packages\.js|scenes\.js)\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" _site/index.html
          grep -E '(styles|demo)\.css|(app|packages|scenes)\.js' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
